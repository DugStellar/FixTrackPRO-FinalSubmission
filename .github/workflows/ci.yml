name: FixTrack Pro CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP Backend Files
        run: |
          echo "Running PHP syntax checks on htdocs API..."
          find . -name "*.php" -exec php -l {} \;

      - name: Verify Core Documentation & Structure
        run: |
          echo "Verifying project structure..."
          ls -la
          if [ -f "README.md" ]; then echo "README.md found!"; fi
